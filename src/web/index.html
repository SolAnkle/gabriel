<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<nav class="nav" aria-label="Main">
  <div class="presence" id="presence"><i aria-hidden="true"></i><span>…</span></div>
  <div class="handle" id="handle"></div>
  <ul>
    <li><a href="#about">About</a></li>
    <li><a href="#life">Life</a></li>
    <li><a href="#lately">Lately</a></li>
    <li><a href="#coin" id="nav-coin">Coin</a></li>
    <li class="keep"><a class="cta" href="/trading">Trading →</a></li>
  </ul>
</nav>

<header class="hero" id="top">
  <div class="light" aria-hidden="true"></div>
  <div class="masthead" aria-hidden="true"><h1 id="masthead"></h1></div>
  <div class="figure" id="figure"></div>

  <aside class="latest" id="latest" aria-live="polite">
    <span class="line" aria-hidden="true"></span>
    <div class="head"><span class="eyebrow" id="lt-who">Latest</span><span class="eyebrow" id="lt-when"></span></div>
    <p id="lt-text"></p>
    <div class="disc" id="lt-disc"></div>
  </aside>

  <div class="intro">
    <div class="eyebrow" id="intro-eyebrow"></div>
    <p id="intro-bio"></p>
  </div>

  <div class="readout">
    <div><div class="eyebrow">Mood</div><div class="mood neutral" id="r-mood">—</div></div>
    <div><div class="eyebrow">Currently</div><div class="where" id="r-where"></div></div>
  </div>

  <div class="rail" aria-hidden="true"></div>
  <div class="subtitle"><span class="tc">Right now</span><span id="sub-text"></span></div>
</header>

<main>
  <section class="chapter" id="about">
    <div class="chapter-head reveal"><span class="no">01 / About</span><h2>This is <em id="about-name">him</em></h2></div>
    <div class="about">
      <div class="reveal">
        <p class="story" id="story"></p>
        <div class="tags" id="tags"></div>
      </div>
      <dl class="facts reveal" id="facts"></dl>
    </div>
  </section>

  <section class="chapter" id="life">
    <div class="chapter-head reveal"><span class="no">02 / Life</span><h2>His <em>life</em></h2></div>
    <div class="reel" id="reel"></div>
    <div class="chapterline reveal" id="chapterline"></div>
  </section>

  <section class="chapter" id="lately">
    <div class="chapter-head reveal"><span class="no">03 / Lately</span><h2>What he's <em>saying</em></h2></div>
    <div class="said">
      <div class="reveal"><p class="pull" id="pull"></p><div class="pull-meta" id="pull-meta"></div></div>
      <div class="reveal">
        <div class="stream" id="stream"></div>
        <div class="people"><div class="eyebrow" style="margin-bottom:10px">His people</div><div id="people"></div></div>
      </div>
    </div>
  </section>

  <section class="chapter" id="coin">
    <div class="chapter-head reveal"><span class="no">04 / His coin</span><h2>He made <em>a coin</em></h2></div>
    <div class="coinblock">
      <div class="tickwrap reveal" id="tickwrap"><div class="tick" id="coin-tick"></div><div class="name" id="coin-name"></div></div>
      <div class="reveal">
        <p class="lore" id="coin-lore"></p>
        <p class="concept" id="coin-concept"></p>
        <div class="mint" id="coin-mint"></div>
      </div>
    </div>
  </section>

  <a class="desk reveal" href="/trading" aria-label="Open his trading page">
    <div class="inner">
      <div>
        <div class="eyebrow">Trading</div>
        <h2>He trades memecoins in public. Every buy, sell, W and L.</h2>
        <div class="go">See the trading desk <span>→</span></div>
      </div>
      <div class="stats" id="desk-stats"></div>
    </div>
  </a>
</main>

<footer>
  <div class="meta"><span id="foot-disc"></span><span id="foot-wallet" class="mono"></span></div>
  <div class="end" id="foot-name" aria-hidden="true"></div>
</footer>

<script src="/site.js"></script>
<script>
const TIER_LINE = { broke: 'broke era', surviving: 'surviving era', comfortable: 'comfortable era', winning: 'winning era', rich: 'rich era' };

// Placeholder until the Higgsfield render is in data/character/: a backlit figure in shadow.
const SILHOUETTE = `<svg viewBox="0 0 600 800" role="img" aria-label="Character render placeholder">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0d0f"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".62" stop-color="#050505" stop-opacity="0"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><path id="sil" d="M300 96c-70 0-116 50-120 118-3 46 10 86 34 114 8 10 10 22 2 30-10 10-32 20-62 28-92 26-132 80-142 170L4 800h592l-8-244c-10-90-50-144-142-170-30-8-52-18-62-28-8-8-6-20 2-30 24-28 37-68 34-114-4-68-50-118-120-118z"/></clipPath>
  </defs>
  <use href="#sil" fill="none" stroke="rgb(var(--glow))" stroke-opacity=".55" stroke-width="10" filter="url(#bloom)"/>
  <use href="#sil" fill="url(#body)"/>
  <g clip-path="url(#clip)"><use href="#sil" fill="none" stroke="rgb(var(--glow))" stroke-opacity=".7" stroke-width="3"/>
    <path d="M232 420c30 34 106 34 136 0" stroke="#cfcfd4" stroke-opacity=".28" stroke-width="2" fill="none"/></g>
  <rect width="600" height="800" fill="url(#fade)"/>
  <text class="ph" x="300" y="610" text-anchor="middle" fill="#8a877f" font-family="Geist Mono, monospace" font-size="12" letter-spacing="3">HIGGSFIELD RENDER GOES HERE</text>
</svg>`;

let heroKey = null, lastPostId = null, typer = null;

function typeInto(el, text) {
  clearInterval(typer);
  if (reduced) { el.textContent = text; return; }
  let i = 0;
  el.innerHTML = '<span class="caret"></span>';
  typer = setInterval(() => {
    i += Math.max(1, Math.round(text.length / 60));
    el.innerHTML = `${esc(text.slice(0, i))}<span class="caret"></span>`;
    if (i >= text.length) { clearInterval(typer); setTimeout(() => (el.textContent = text), 1800); }
  }, 28);
}

const media = (u, alt = '') => /\.(mp4|webm)(\?|$)/i.test(u) ? `<video src="${esc(u)}" autoplay muted loop playsinline></video>` : `<img src="${esc(u)}" alt="${esc(alt)}" loading="lazy">`;

function render(s) {
  const id = s.identity || {};
  const name = id.name || 'Unborn';
  document.title = name;

  // ---- hero ----
  const upper = name.toUpperCase();
  if ($('masthead').dataset.name !== upper) {
    $('masthead').dataset.name = upper;
    $('masthead').innerHTML = [...upper].map((c, i) => `<span class="ch" style="transition-delay:${i * 45}ms">${esc(c)}</span>`).join('');
  }
  const key = s.hero?.url || 'ph';
  if (key !== heroKey) {
    heroKey = key;
    $('figure').innerHTML = !s.hero ? SILHOUETTE
      : s.hero.video ? `<video src="${esc(s.hero.url)}" autoplay muted loop playsinline aria-label="${esc(name)}"></video>`
      : `<img src="${esc(s.hero.url)}" alt="${esc(name)}">`;
  }
  const post = s.posts[0];
  if (post) {
    $('latest').classList.add('has');
    $('lt-who').textContent = post.action === 'REPLY' ? `Reply to @${post.target}` : post.action === 'QUOTE' ? `Quoting @${post.target}` : 'Latest post';
    $('lt-when').textContent = ago(post.at);
    const [body, disc] = splitDisclosure(post.text);
    $('lt-disc').textContent = disc ? disc.replace(/^\[holding /, 'Holds ').replace(/\]$/, '') : '';
    if (post.id !== lastPostId) { lastPostId = post.id; typeInto($('lt-text'), body); }
  }
  $('intro-eyebrow').textContent = id.username ? `@${id.username}` : '';
  $('intro-bio').textContent = id.bio || '';
  $('r-mood').textContent = s.mood.word;
  $('r-mood').className = `mood ${s.mood.tone}`;
  $('r-where').textContent = s.visual?.setting || '';
  $('sub-text').textContent = s.now ? `${name} is ${s.now.line}` : `${name} is offline`;

  // ---- about ----
  $('about-name').textContent = name.charAt(0) + name.slice(1).toLowerCase();
  $('story').textContent = id.backstory || '';
  $('tags').innerHTML = [...(id.traits || []), ...(id.offTheCharts || [])].map((t) => `<span>${esc(t)}</span>`).join('');
  const facts = [
    ['Age', id.age], ['Lives', id.basedIn], ['Believes', id.worldview], ['Humour', id.humor],
    ['Wants', (id.ambitions || []).join(', ')], ['Secretly', (id.insecurities || []).join(', ')],
  ].filter(([, v]) => v);
  $('facts').innerHTML = facts.map(([k, v]) => `<div><dt class="eyebrow">${k}</dt><dd>${esc(v)}</dd></div>`).join('');

  // ---- life ----
  const shots = [
    ...s.gallery.map((g) => `<figure class="shot reveal">${media(g.url, name)}</figure>`),
    ...s.scenes.map((c) => c.mediaUrl
      ? `<figure class="shot reveal">${media(c.mediaUrl, c.caption)}<figcaption class="cap"><span class="eyebrow">${ago(c.at)}</span><p>${esc(c.caption)}</p></figcaption></figure>`
      : `<figure class="shot plan reveal"><span class="eyebrow">Coming soon · ${ago(c.at)}</span><div><p>“${esc(c.caption)}”</p><div class="scene">${esc(c.scene)}</div></div></figure>`),
  ];
  $('reel').innerHTML = shots.length ? shots.join('') : '<p class="none">No photos yet.</p>';
  $('chapterline').innerHTML = `<span class="eyebrow">Right now</span><span class="now">He's in his <b>${esc(TIER_LINE[s.lifeTier] || s.lifeTier)}</b>${s.visual?.setting ? `: ${esc(s.visual.setting)}` : ''}</span>`;

  // ---- lately ----
  const [first, ...rest] = s.posts;
  $('pull').textContent = first ? splitDisclosure(first.text)[0] : 'Quiet so far.';
  $('pull-meta').innerHTML = first ? [
    `<span class="eyebrow">@${esc(id.username)}</span>`, `<span class="eyebrow">${ago(first.at)}</span>`,
    first.disclosed?.length ? `<span class="eyebrow" style="color:var(--accent)">Holds ${esc(first.disclosed.join(', '))}</span>` : '',
    first.url ? `<a class="eyebrow" href="${esc(first.url)}" target="_blank" rel="noopener">View on X ↗</a>` : '',
  ].join('') : '';
  $('stream').innerHTML = rest.slice(0, 6).map((p) => `<div class="item"><div class="eyebrow">${p.action === 'POST' ? 'Post' : `${p.action === 'REPLY' ? 'Reply to' : 'Quote of'} @${esc(p.target)}`} · ${ago(p.at)}</div><p>${esc(p.text)}</p></div>`).join('');
  const feel = (n) => n >= 3 ? 'friend' : n >= 1 ? 'warming up' : n <= -3 ? 'beef' : n <= -1 ? 'wary' : 'acquaintance';
  $('people').innerHTML = s.relationships.length
    ? s.relationships.map((p) => `<div class="person"><span><b>@${esc(p.handle)}</b> <span class="dim">${esc(p.tags.slice(0, 2).join(', '))}</span></span><span class="mono ${p.sentiment >= 0 ? 'up' : 'down'}" style="font-size:12px">${feel(p.sentiment)}</span></div>`).join('')
    : '<p class="dim serif" style="font-size:22px;margin:6px 0 0">Nobody yet. Everyone’s a stranger at first.</p>';

  // ---- coin ----
  $('nav-coin').textContent = s.coin ? `$${s.coin.ticker}` : 'Coin';
  $('coin-tick').textContent = s.coin ? `$${s.coin.ticker}` : '';
  $('coin-name').textContent = s.coin?.name || '';
  $('coin-lore').textContent = s.coin?.lore ? `“${s.coin.lore}”` : '';
  $('coin-concept').textContent = s.coin?.concept || '';
  $('coin-mint').innerHTML = s.coin?.address
    ? `Mint ${esc(s.coin.address)} · <a href="https://dexscreener.com/solana/${esc(s.coin.address)}" target="_blank" rel="noopener" style="text-decoration:underline">chart ↗</a>`
    : 'Launching soon';

  // ---- trading band ----
  const wins = s.closed.filter((c) => c.pnlPct >= 0).length;
  $('desk-stats').innerHTML = [
    ['Treasury', usd(s.treasury.total)],
    ['Holding', `${s.positions.length} coin${s.positions.length === 1 ? '' : 's'}`],
    ['Closed', s.closed.length ? `${wins}W · ${s.closed.length - wins}L` : '—'],
  ].map(([k, v]) => `<div><div class="eyebrow">${k}</div><div class="v">${v}</div></div>`).join('');
}

fitters.push(() => {
  const pad = parseFloat(getComputedStyle(document.querySelector('.nav')).paddingLeft) || 16;
  const vw = document.documentElement.clientWidth;
  fit($('masthead'), (vw - 2 * Math.min(pad, 24)) * .95);
  fit($('foot-name'), (vw - 2 * pad) * .97);
  fit($('coin-tick'), $('tickwrap').clientWidth, 200);
  const m = $('masthead').getBoundingClientRect();
  document.documentElement.style.setProperty('--mh', `${m.bottom - $('top').getBoundingClientRect().top}px`);
});

Site.start(render);
</script>
</body>
</html>
